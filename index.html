"contextoBiblico": "El Salmo 13 es uno de los llamados \"salmos de lamento\" — un género bíblico entero dedicado a nombrar el dolor con precisión ante Dios. David no dice simplemente \"estoy mal.\" Nombra exactamente lo que siente: sensación de abandono, angustia diaria, tristeza del corazón, temor a ser derrotado. Y luego, en el mismo salmo, sin que el problema se haya resuelto, hace una elección consciente hacia la confianza. El patrón bíblico del lamento es: nombrar con exactitud, y luego entregar a Dios lo nombrado.",
"pasajeApoyo": {
"ref": "Salmo 62:8",
"texto": "\"Esperad en él en todo tiempo, oh pueblo; derramad delante de él vuestro corazón; Dios es nuestro refugio.\""
},
"conexion": "\"Derramar el corazón\" es exactamente lo que el codependiente nunca aprendió a hacer — ni siquiera consigo mismo. David modela el proceso completo: identificar la emoción exacta, nombrarla ante Dios sin filtro, y luego moverse hacia la confianza. El Quinto Paso pide ese mismo proceso, primero internamente. No podemos admitir ante otro lo que no hemos identificado en nosotros mismos. La precisión emocional es el primer acto de honestidad.",
"preguntas": [
"David nombra exactamente lo que siente: abandono, angustia, tristeza, temor. La dificultad para identificar lo que se siente es una característica central de la codependencia. En este momento, sin pensarlo demasiado, ¿qué estás sintiendo realmente? Nombralo con una palabra concreta, no con \"estoy bien\" o \"estoy mal.\"",
"El Salmo 62:8 invita a \"derramar el corazón\" delante de Dios. ¿Alguna vez sentiste que no tenías permiso para sentir lo que sentías? ¿De dónde viene esa creencia?",
"David pasa del lamento a la confianza sin negar el dolor. ¿Podés nombrar algo doloroso que sentís hoy y, sin resolverlo todavía, elegir confiar en Dios en medio de eso, como hizo David?"
],
"practica": "Hacé tres \"check-ins\" emocionales hoy: al despertar, a media tarde y antes de dormir. En cada uno, preguntate: \"¿Qué estoy sintiendo ahora mismo?\" y respondé con una sola palabra concreta (triste, ansioso, en paz, enojado, agradecido). Anotalas."
},
{
"dia": "Jueves",
"aspecto": "La vergüenza tóxica — la herida que viene de antes",
"ensenanza": "Hay una diferencia crucial entre sentirse mal por algo que hicimos y sentirse mal por lo que somos. La primera es culpa; puede resolverse. La segunda es vergüenza tóxica, y suele instalarse mucho antes de que pudiéramos entenderla — en la infancia, a veces sin una sola palabra, solo con miradas, silencios o formas de trato que nos enseñaron que había algo fundamentalmente mal en nosotros.\n\nBeattie describe el terror que sintió al enfrentar su primer Quinto Paso: \"Es un lugar lleno de terror, miedo, culpa acerca de lo que he hecho, y culpa acerca de haber cometido un error. Es un lugar de miedo frente a admitir y aceptar quién soy.\"\n\nNotá la distinción que ella misma hace, casi sin querer: culpa por lo que hizo, y algo más profundo — miedo frente a \"admitir y aceptar quién soy.\" Ese segundo miedo es la vergüenza tóxica. No dice \"hice algo malo.\" Dice \"soy algo malo.\" Y es la creencia más difícil de desarraigar, porque no se combate con lógica — se sana con una relación distinta, con Dios y con otros, que demuestre lo contrario.",
"historia": "Jane describe el efecto del Quinto Paso sobre su vergüenza acumulada: \"El Quinto Paso me ayudó a derrumbar los muros que había construido. Y nunca quiero volverlos a colocar. Me morí detrás de esos muros; me morí de defectos de carácter. No los podía quitar, pero Dios me mostró cuándo estaba lista para soltarlos.\"\n\nJane no dice que sus defectos desaparecieron mágicamente. Dice que los muros de vergüenza que había construido alrededor de ellos —los que la mantenían escondida y sola— finalmente cayeron. La vergüenza no se resuelve escondiéndose más; se resuelve siendo vista y descubriendo que uno sigue siendo digno de amor de todos modos.",
"pasajePrincipal": {
"ref": "Génesis 3:8-10",
"texto": "\"Y oyeron la voz del Señor Dios que se paseaba en el jardín... y el hombre y su mujer se escondieron de la presencia del Señor Dios entre los árboles del jardín... Tuve miedo, porque estaba desnudo; y me escondí.\""
},
"contextoBiblico": "Este es el primer registro de vergüenza en la Biblia, y ocurre inmediatamente después de la primera desobediencia humana. Es notable que Adán no dice \"hice algo malo\" — dice \"tuve miedo porque estaba desnudo.\" La desnudez aquí no es literal solamente: representa la exposición total, el ser completamente visto sin nada que ocultar. La primera respuesta humana a sentirse expuesto no es la confesión — es el escondite. Es exactamente el patrón de la vergüenza tóxica: escondernos de Dios, de otros y de nosotros mismos, precisamente cuando más necesitamos ser vistos.",
"pasajeApoyo": {
"ref": "Isaías 43:1-4",
"texto": "\"No temas, porque yo te redimí; te puse nombre, mío eres tú... porque a mis ojos fuiste de gran estima, fuiste honorable, y yo te amé.\""
},
"conexion": "Adán se escondió por vergüenza. Dios lo buscó de todos modos: \"¿Dónde estás?\" — no porque no supiera, sino para invitarlo a salir del escondite. Isaías 43 es la respuesta completa a la vergüenza de Génesis 3: Dios no solo busca — declara valor. \"A mis ojos fuiste de gran estima.\" La vergüenza tóxica dice \"soy indigno de ser visto.\" Dios dice \"te puse nombre, eres mío, te amo.\" El Quinto Paso es, en el fondo, un ejercicio de salir del escondite de Génesis 3 para recibir la palabra de Isaías 43.",
"preguntas": [
"Adán se escondió por vergüenza, no por culpa específica de un acto — se escondió por sentirse expuesto en su ser. La vergüenza tóxica arraigada desde la infancia funciona igual: no dice \"hice mal\" sino \"soy malo.\" ¿Podés identificar el mensaje de vergüenza más antiguo que recordás sobre vos mismo, y de dónde vino?",
"Isaías 43 dice \"a mis ojos fuiste de gran estima... y yo te amé.\" ¿Podés recibir esa declaración hoy, específicamente en el área donde sentís más vergüenza? ¿Qué te impide creerla?",

],
"practica": "Escribí el mensaje de vergüenza más antiguo que tengas sobre vos mismo (\"soy una carga\", \"nadie me quiere de verdad\", \"algo está mal conmigo\"). Al lado, escribí una frase de Isaías 43:1-4 que lo contradiga directamente. Leé ambas en voz alta."

{
"dia": "Viernes",
"aspecto": "La culpa crónica — cargar lo que no nos pertenece",
"ensenanza": "Hay una culpa que tiene causa real: hicimos algo, sabemos qué fue, y podemos repararlo. Pero muchos codependientes cargamos otra clase de culpa: una que no corresponde a ningún acto concreto, que aparece sin razón aparente, que nos hace sentir mal por existir, por pedir, por decir que no, por simplemente ocupar espacio.\n\nBeattie identifica esta dinámica con precisión: aprendimos a hacernos responsables de los sentimientos y decisiones de otros hasta el punto de sentirnos culpables de cosas completamente fuera de nuestro control. Esta culpa desproporcionada no es casualidad — es funcional para quienes nos rodean. Nos mantiene en el lugar de servicio permanente, nos hace fáciles de manipular, nos impide poner límites porque poner un límite se siente, de inmediato, como una falta moral.\n\nEl Quinto Paso pide \"la naturaleza exacta\" de nuestros errores — y eso implica también identificar qué culpa es real y cuál no nos pertenece en absoluto.",
"historia": null,

"contextoBiblico": "Pablo escribe estas palabras como parte del clímax de Romanos 8, uno de los capítulos más liberadores de todo el Nuevo Testamento. La pregunta retórica \"¿quién acusará?\" no espera una respuesta afirmativa — Pablo la responde inmediatamente: nadie puede sostener una acusación válida contra quien Dios ha justificado. El contexto es legal: Pablo usa lenguaje de tribunal para decir que el caso está cerrado, no por falta de evidencia sino porque el juez mismo tomó el lugar del acusado.",

"conexion": "Este versículo de Ezequiel es una de las declaraciones más claras de la Biblia sobre la responsabilidad individual: cada persona responde por lo suyo, no por lo de otro. Muchos codependientes crecieron en sistemas familiares donde esta verdad se invirtió — donde se sentían responsables de las emociones, decisiones y fracasos de sus padres o de otros. Ezequiel devuelve el límite correcto. Y Romanos 8 va más allá: incluso por lo que sí nos corresponde, ya no hay condenación. La culpa crónica sin causa real es, en el fondo, una acusación que ni siquiera Dios sostiene.",

"aspecto": "El acto de admitir — la libertad de decir la verdad en voz alta",
"ensenanza": "Después de ver la negación, desarmar la racionalización, aprender a nombrar lo que sentimos, y distinguir entre vergüenza tóxica y culpa real, llegamos al corazón del Quinto Paso: admitirlo. Ante Dios, ante nosotros mismos, y ante otro ser humano.\n\nBeattie es enfática sobre esto: no basta con pensarlo. \"No era suficiente pensar acerca de quién era yo, ya fuera qué sentía, qué había hecho, o qué creía. Necesitaba externarlo.\" Hay algo que sucede cuando decimos la verdad en voz alta, con un testigo, que no sucede cuando solo la pensamos. Ella lo describe como algo casi mágico pero aterrador: \"Existe algo mágico pero aterrador acerca de abrir nuestra boca y decir la verdad. También existe algo curativo en ello.\"\n\nUna regla que ella aplicó a todos sus Quintos Pasos: \"De lo que menos quiero hablar es de lo que más necesito hablar honestamente.\" Aquello que más vergüenza y miedo nos da compartir es, casi siempre, exactamente lo que más necesitamos sacar a la luz.",
"historia": "Beattie describe el momento en que decidió, dentro de un tratamiento formal, hacer su primer Quinto Paso completo. Fue aterrador — tanto como \"entrar a la oficina de un clérigo para hablar de mi larga lista de errores.\" Pero lo hizo. Y el efecto no se limitó a esa hora: \"Este acto de decir honestamente quién era yo, no se limitó a una confesión de una hora durante el Quinto Paso. Comenzó a extenderse. Comencé a revelarme ante mi madrina, ante amistades, en el grupo.\"\n\nLa primera vez que se abrió por completo — sobre los secretos, la culpa, el temor, el enojo y el dolor que la habían perseguido durante años, sobre todo los daños que había hecho — pensó que se vendrían abajo las paredes. \"¿Saben qué?\", escribe. \"Así sucedió.\" Pero las paredes que cayeron no eran las que la sostenían — eran las que la mantenían encerrada.",
"pasajePrincipal": {

"contextoBiblico": "Santiago escribe a comunidades cristianas dispersas, enfrentando enfermedad, dificultad y pecado no confesado. El versículo conecta directamente la confesión con la sanación — no como causa mágica sino como proceso relacional: cuando confesamos ante otro y oramos juntos, algo sana que no sana en el aislamiento. La palabra griega para \"sanados\" (iaomai) se usa tanto para sanidad física como espiritual. Santiago no pide confesión pública generalizada — pide confesión mutua, dentro de relaciones de confianza, con el propósito específico de sanar.",

"conexion": "Santiago describe exactamente el proceso del Quinto Paso: confesión mutua, dentro de una relación segura, con el propósito de sanar. No es confesión ante cualquiera — es ante alguien elegido con cuidado, alguien seguro. Y Juan 8:32 completa la promesa: la verdad, dicha en voz alta, libera. Beattie experimentó exactamente esto — la sensación física de que las paredes caían. El Quinto Paso no es un trámite religioso: es el mecanismo que Dios diseñó, según ambos textos, para que la sanación ocurra en compañía, no en soledad.",

"Juan 8:32 promete que la verdad libera. ¿A quién elegirías, con cuidado y oración, para hacer tu propio Quinto Paso — alguien seguro, que pueda escuchar sin juzgarte y ayudarte a ver también lo bueno que hay en vos?"

"ensenanza": "El Sexto Paso nos pide algo que suena simple pero es profundamente difícil: estar enteramente dispuestos a que Dios nos libere de nuestros defectos de carácter. Uno de los más resistentes y más dolorosos es el perfeccionismo acompañado de una autocrítica severa — la creencia de que solo merecemos aceptación si logramos hacerlo todo bien, y que cualquier error confirma nuestra indignidad fundamental.\n\nBeth ofrece una perspectiva que suaviza la dureza de este Paso: \"Odio la frase 'defectos de carácter'. Yo elijo ver este Paso de la siguiente forma: estuvimos enteramente dispuestos a que Dios nos sanara. No creo que actuamos porque somos defectuosos o malos. Pienso que actuamos en forma codependiente porque estamos heridos.\" El perfeccionismo no nació de la vanidad — nació del miedo a no ser suficiente, y se convirtió en un mecanismo de defensa que ahora nos exige lo imposible.\n\nBeattie lo confirma en su propia lista de lo que estamos dispuestos a soltar: \"nuestra necesidad de ser perfectos.\" No para dejar de esforzarnos por hacer las cosas bien, sino para dejar que nuestro valor como personas ya no dependa de lograrlo siempre.",
"historia": "Sandy tuvo una noche terrible: se calló ante un chisme, vio a un ex con otra persona, y su madre la avergonzó por teléfono. Todo eso reactivó su autocrítica severa: \"He aprendido a creer que puedo ser exitosa en el trabajo. Pero no creo que voy a ser feliz en el amor. No creo que a Dios le interese esa parte de mi vida. No me siento digna de ser amada.\"\n\nLo más revelador es cómo terminó hablando con Dios: \"Perdón. Lo siento, Dios, que soy una decepción para ti y para todos los que me rodean.\" Ni siquiera había hecho algo malo esa noche —simplemente vivió situaciones difíciles normales— y sin embargo su autocrítica la llevó a pedir perdón por existir de manera imperfecta.\n\nCuando le sugirieron trabajar los Pasos Seis y Siete, Sandy respondió: \"He estado trabajando esos Pasos. Y parece empeorar. ¡Entre más los trabajo, más me fijo en lo que estoy haciendo!\" La respuesta que recibió fue clave: \"Entonces puedes relajarte y confiar en el proceso porque está funcionando.\" Ver con más claridad el propio perfeccionismo no es retroceso — es el principio de soltarlo.",

{
"dia": "Martes",
"aspecto": "El miedo al cambio, aun cuando la situación es dañina",
"ensenanza": "Uno de los defectos de carácter más paradójicos que el Sexto Paso nos pide soltar es el miedo al cambio — incluso, y especialmente, cuando la situación actual nos está haciendo daño. Es contraintuitivo: uno pensaría que querríamos escapar rápidamente de lo que nos lastima. Pero lo conocido, aunque duela, se siente más seguro que lo desconocido, aunque sea sano.\n\nBeattie lo describe con honestidad: \"Podemos sentir miedo por lo que quedará, o si habrá suficiente dentro de nosotros para poder cuidarnos.\" Este miedo es una reacción normal, no una falla moral: \"Es posible que nuestros mecanismos de defensa nos hayan salvado la vida. En algún momento quizá fueron todo lo que teníamos para evitar ser aplastados.\"\n\nEl Sexto Paso no nos pide que forcemos el cambio de golpe, sino que estemos dispuestos —enteramente dispuestos— a que Dios haga ese trabajo cuando llegue el momento correcto. Reconocer el miedo al cambio no es fracaso: es el primer paso honesto hacia soltar ese miedo.",
"historia": "Beattie compara el miedo al cambio con la historia bíblica de la esposa de Lot: \"Huir de nuestro pasado puede parecernos tan necesario como lo fue para Lot en tiempos bíblicos, cuando vio a su mujer convertida en una columna de sal después de mirar hacia atrás. No mirar hacia atrás, no enfrentar nuestro pasado, nos puede parecer igual de aterrador y prohibido.\"\n\nEsta comparación revela algo profundo: muchas veces tememos tanto avanzar hacia el cambio como quedarnos mirando el pasado. \"Dependíamos de estos comportamientos, nuestros comportamientos codependientes, como si fueran amigos confiables. Pero quizá nos traicionaron. Lo que alguna vez nos protegía, ahora puede perdernos.\"\n\nBeattie ofrece una salida a este atasco: \"Podemos aprender una manera mejor. Si no estamos listos o dispuestos a soltar nuestros defectos o a una persona o cualquier cosa, podemos pedir a nuestro Poder Superior que nos ayude a estar dispuestos y listos.\" No necesitamos tener el valor completo hoy — podemos pedir el valor para empezar a estar dispuestos.",

"practica": "Escribí: \"Tengo miedo de cambiar [nombrá la situación] porque temo [nombrá el miedo específico].\" Luego escribí Isaías 43:18-19 al lado y pedile a Dios, en tus propias palabras, ayuda para estar dispuesto — no para cambiar todavía, solo para estar dispuesto."

{
"dia": "Miércoles",

"ensenanza": "Muy relacionado con el miedo al cambio está algo más sutil: la resistencia activa a soltar patrones que reconocemos como dañinos, incluso después de identificarlos con claridad. No es solo miedo pasivo — es un aferrarse consciente, casi terco, a lo que ya sabemos que no funciona.\n\nBeattie describe esta dinámica con humor y honestidad: \"Vivo mi día y veo una y otra vez lo controladora que soy\", dijo Jan. \"No estoy dejando de controlar. Sólo veo una y otra vez lo controladora que soy.\" Ver el patrón no es lo mismo que soltarlo — a veces pasamos una temporada entera simplemente notando el comportamiento, tropezando con él una y otra vez, antes de que llegue el momento real del cambio.\n\nEsto no es fracaso. Beattie lo aclara: \"Es el momento de recordarnos que estamos cambiando. En este momento, estamos en el proceso de ser cambiados.\" La resistencia a soltar un patrón conocido, por dañino que sea, es parte del proceso — no una señal de que estamos fallando en el Sexto Paso, sino una etapa de él.",
"historia": "Patty fue honesta sobre algo que pocos se atreven a admitir: \"Quería quedarme con mis defectos. Fue tan gozoso darme cuenta de que no tenía que ser esa persona maravillosa y generosa todo el tiempo. Podía por fin ser desagradable y ruin y a veces indiferente.\"\n\nSu testimonio revela algo importante: no todos nuestros patrones son dañinos por definición — algunos son simplemente parte de nuestra personalidad, y confundirlos con defectos que hay que erradicar puede ser tan dañino como aferrarse a los que sí necesitan cambiar. \"Me tardé en diferenciar qué defectos necesitaban atención y cuáles eran simplemente una parte de mi personalidad.\"\n\nBeattie tranquiliza: \"No se preocupen. Nada que necesitemos nos será quitado. Y lo que nos sea quitado será reemplazado por algo mejor.\" La resistencia a soltar patrones conocidos a veces protege algo valioso que no debe desaparecer, y otras veces protege algo que genuinamente nos hace daño. Distinguir entre ambos es parte del trabajo de este Paso.",

"preguntas": [

{

"ensenanza": "El Sexto Paso incluye, entre lo que estamos dispuestos a soltar, nuestras adicciones — y estas no se limitan a sustancias. Los comportamientos compulsivos toman muchas formas: trabajo, comida, relaciones, gasto de dinero, control. Todos comparten una misma raíz: usar una conducta repetitiva para evitar sentir algo que nos resulta insoportable.\n\nBeattie lo describe entre los defectos que soltamos: \"nuestras adicciones\", junto con \"la culpa\" y \"la vergüenza, ese sentimiento de que no está bien ser quienes somos.\" Los comportamientos compulsivos y la vergüenza suelen retroalimentarse: actuamos compulsivamente para aliviar el malestar, y luego sentimos vergüenza por haberlo hecho, lo cual genera más malestar que buscamos aliviar compulsivamente otra vez.\n\nEl Sexto Paso no nos pide fuerza de voluntad para detener el comportamiento compulsivo por nuestra cuenta —de hecho, esa lucha en solitario suele ser parte del problema. Nos pide estar dispuestos a que Dios nos libere de la necesidad subyacente que alimenta la compulsión, no solo del comportamiento visible.",
"historia": "Beattie relata un momento de su propia vida donde un dolor antiguo resurgió: su padre la llamó y, por primera vez, hablaron abiertamente sobre el día en que él le dijo que se iba, cuando ella tenía solo tres años.\n\n\"Despertar un dolor emocional, disparó mis comportamientos codependientes como suele hacer. Tenía miedo. Temía que me quedaría atorada en mis sentimientos para siempre. Me entró el pánico. Comencé a idear formas externas que pudieran detener el dolor. Quería comenzar a manipular a las personas y los sucesos a mi antojo, con la esperanza de que me hiciera sentir mejor.\"\n\nAhí está el patrón compulsivo en su forma más clara: dolor emocional → pánico → impulso de actuar compulsivamente (en su caso, manipular) para evitar sentir. En vez de ceder a ese impulso, Beattie hizo algo distinto: \"Me quedé quieta, acostada, un rato y trabajé en silencio el Sexto Paso. 'Ayudame a estar dispuesta a soltar el miedo, el dolor, el pánico... en vez de pedir a otros que lo detengan o que cambien cómo me siento.'\" El comportamiento compulsivo perdió su urgencia cuando ella se permitió sentir el dolor en vez de huir de él a través de la acción compulsiva.",

"ensenanza": "Quizás uno de los defectos de carácter más difíciles de soltar para el codependiente es la identidad construida enteramente alrededor del rol de cuidador o salvador. Cuando toda una vida se organizó alrededor de ser quien resuelve, quien sostiene, quien salva a otros, soltar ese rol se siente como perder la identidad misma, no solo un comportamiento.\n\nBeattie lo describe con precisión en su lista de lo que estamos dispuestos a soltar: \"nuestra necesidad de ser cuidadoras — nuestra tendencia a enfocarnos en los problemas, asuntos, sentimientos, necesidades, elecciones y vidas de otros; la creencia subyacente de que somos responsables de otros.\" Y añade algo revelador: \"Nos disponemos a ser sanados de la creencia que otros, o nosotros mismos, son/somos incompetentes y no pueden/podemos cuidar de sí/nosotros mismos.\"\n\nAhí está la raíz: el rol de salvador se sostiene sobre la creencia de que el otro no puede cuidarse solo. Soltar este defecto de carácter significa confiar en que Dios puede cuidar a esa persona sin nuestra intervención constante — y que nosotros valemos, incluso cuando no estamos salvando a nadie.",
"historia": "Beattie describe cómo, entre lo que estamos dispuestos a soltar, está \"nuestro autoabandono, y la creencia de que no somos responsables de nosotros mismos\" —el reverso exacto del rol de cuidador que se olvida de sí mismo por atender a otros. También incluye \"nuestro deseo de que otros nos cuiden, o sean responsables de nosotros\", reconociendo que a veces el rol de cuidador esconde también una necesidad no resuelta de ser cuidado.\n\nEsta doble cara del rol de salvador —dar cuidado constante mientras se anhela recibirlo— es parte de lo que hace tan difícil soltarlo. Beattie escribe sobre su propio proceso de aprender otra manera: \"He usado este Paso para una multitud de comportamientos, tales como aprender a estar en intimidad, aprender a sentir y expresar mis sentimientos y aprender a cuidar mejor de mí misma en todas las circunstancias.\" El trabajo no fue dejar de cuidar a nadie nunca más — fue aprender a incluirse a sí misma en el círculo de personas dignas de cuidado.",

"ensenanza": "Una de las creencias más profundas y dolorosas de la codependencia es sentirse indigno de amor o de cosas buenas — no como un pensamiento ocasional, sino como una convicción de fondo que colorea cada relación, cada oportunidad, cada momento de posible alegría.\n\nBeattie describe el miedo que esta creencia genera ante el Séptimo Paso: si Dios le quitaba sus defectos, ¿qué quedaría? La pregunta revela algo importante: muchos codependientes sienten que sus defectos y su sufrimiento son, en algún nivel retorcido, lo que los hace merecedores de existir — como si el dolor fuera una especie de moneda de cambio para justificar el derecho a estar vivos.\n\nPero el Séptimo Paso pide algo distinto: humildemente pedirle a Dios que nos libere, confiando en que del otro lado de esa liberación no hay vacío sino plenitud. Beattie lo confirma con su propia experiencia: \"Nada, nada, puede interferir con el bien que te toca en la vida.\" Sentirnos indignos de amor o de cosas buenas no es una verdad sobre nosotros — es una barrera que este Paso nos invita a soltar.",

"historia": "Beattie describe su primer Séptimo Paso formal: se recluyó en un cuarto, cerró la puerta, y le pidió a su Creador que le quitara todos sus defectos de carácter. \"A pesar de mis temores, lo dije sinceramente.\" Pero después de orar, no supo qué hacer con la espera: \"Medité un rato, y luego me alisté a salir del cuarto, preguntándome qué sucedería.\"\n\nEsa incomodidad ante la espera revela la dificultad de recibir: había hecho la parte de pedir, pero no sabía cómo simplemente confiar y dejar que la respuesta llegara sin forzarla. Con el tiempo, aprendió: \"No tuve que cambiarme a mí misma. No fui revolucionada instantáneamente cuando di este Paso. Pero darlo, inició el proceso.\"\n\nAprender a recibir, para Beattie, significó soltar la necesidad de controlar cómo y cuándo llegaría el cambio, y simplemente permitir que se le diera —un ejercicio de recepción tan desconocido para ella como lo es para muchos codependientes.",

"ensenanza": "Muy relacionado con basar el valor propio en la opinión de los demás está algo más activo y agotador: la necesidad de aprobación constante — no un deseo ocasional de ser bien visto, sino una búsqueda incesante que nunca se sacia del todo, porque la última aprobación recibida nunca alcanza para calmar la necesidad de la siguiente.\n\nBeattie describe cómo este patrón, cuando lo vio con claridad, la hizo sentir que tenía \"mucho que perder\" si Dios se lo quitaba — como si la aprobación constante fuera parte esencial de su funcionamiento, no un peso del que liberarse. Esa confusión es común: confundimos la necesidad compulsiva de aprobación con motivación sana, cuando en realidad son cosas muy distintas.\n\nEl Séptimo Paso ofrece una salida específica: en vez de buscar aprobación de personas —una fuente que nunca provee suficiente ni de manera constante—, pedirle humildemente a Dios que sane la necesidad misma. No se trata de conseguir la aprobación perfecta y definitiva de todas las personas relevantes en nuestra vida. Se trata de que la necesidad compulsiva de buscarla deje de gobernarnos.",

"ensenanza": "\"Cuando leí por primera vez el Octavo Paso, lo leí mal\", dijo Jason. \"Pensé que decía: 'Hacer una lista de todas las personas que te han dañado'.\" Ese malentendido es común y revelador: nos resulta más natural pensar en cómo nos dañaron a nosotros que en cómo dañamos nosotros a otros — especialmente a través de la manipulación.\n\nManipular a otros para lograr un resultado deseado es una de las características más difíciles de reconocer en uno mismo, porque casi nunca se siente como manipulación en el momento — se siente como supervivencia, como la única manera de conseguir lo que necesitábamos o de evitar lo que temíamos. Pero Beattie es clara: cuando llegó a este lugar en su propia codependencia, \"mi comportamiento inadecuado hacia otros era claro. No había posibilidad de justificarlos, racionalizarlos, o explicarlos. Había obrado mal.\"\n\nEl Octavo Paso nos pide dejar de mirar el comportamiento del otro y examinar el nuestro con honestidad: ¿a quién manipulamos? ¿Mentimos, aunque fuera \"por una buena causa\"? Este examen no busca hacernos sentir culpables sin fin — busca liberarnos, nombrando con precisión lo que hicimos para poder repararlo.",

"dia": "Miércoles",
"aspecto": "Evitar conflictos a toda costa",
"ensenanza": "Muchos codependientes desarrollamos una aversión tan profunda al conflicto que preferimos cualquier cosa —silencio, resentimiento acumulado, distancia emocional— antes que enfrentar directamente un desacuerdo. Evitar conflictos a toda costa se siente como paz, pero en realidad es la ausencia de la resolución real que solo puede llegar a través del conflicto sano.\n\nBeattie reconoce que las reparaciones a veces requieren precisamente lo que más evitamos: el contacto directo con alguien, especialmente cuando la relación ya está tensa. \"A veces nuestras reparaciones son con personas con quienes no deseamos mantener una relación\", escribe. \"Sencillamente queremos 'barrer nuestro lado de la calle.'\" Este \"barrer nuestro lado\" requiere, casi siempre, atravesar la incomodidad del posible conflicto en vez de evitarlo indefinidamente.\n\nEl Noveno Paso no nos pide buscar el conflicto por el conflicto mismo, pero sí nos pide dejar de evitarlo cuando es necesario para la reparación genuina. Beattie es clara sobre el miedo que esto genera: \"Cada vez que me preparo para hacer una reparación, siento mariposas en el estómago.\" El miedo al conflicto no desaparece — pero podemos actuar de todos modos, y descubrir, como ella describe, que \"cada vez que lo hago, me siento bien.\"",
"historia": "Beattie describe su propio proceso de enfrentar, en vez de evitar, un conflicto necesario con sus hijos sobre su falta de límites consistentes en el pasado: \"Me disculpé con ellos por no ser una madre adecuada. Pero hacía falta más. Necesitaban una madre capaz de poner límites consistentes y confiables.\"\n\nEste ejemplo revela algo importante: evitar el conflicto —simplemente pedir disculpas y seguir como antes— no hubiera sido suficiente. Beattie tuvo que enfrentar directamente el patrón disfuncional y sostener el cambio, incluso cuando eso implicaba momentos de tensión y resistencia por parte de sus hijos, acostumbrados a la inconsistencia anterior.\n\nEl resultado, años después, fue revelador: su hija Nichole, sin que Beattie lo pidiera, defendió el cambio de su madre frente a una amiga: \"Ah, sí, así era mi madre antes. Ahora ha cambiado.\" El conflicto que Beattie enfrentó —en vez de evitarlo— terminó produciendo la seguridad que sus hijos necesitaban.",

"dia": "Jueves",
"aspecto": "Culpa excesiva por daños del pasado",
"ensenanza": "El Noveno Paso corre el riesgo de reactivar algo que ya trabajamos en pasos anteriores: la culpa excesiva por daños del pasado, desproporcionada a la responsabilidad real que tenemos. Beattie advierte específicamente sobre este peligro: \"El propósito de las reparaciones no es cambiar a otros o esperar algo diferente de ellos. El propósito de las reparaciones es asumir la responsabilidad por nuestro propio comportamiento... y sentirnos bien acerca de nuestra conducta dentro de las relaciones.\"\n\nNótese el objetivo final: sentirnos bien, no perpetuar la culpa indefinidamente. La reparación sana tiene un principio y un fin — se identifica el daño, se repara lo que se puede reparar, y se suelta. La culpa excesiva, en cambio, no tiene fin: sigue reviviendo el mismo daño una y otra vez, mucho después de haber hecho lo que estaba en nuestras manos hacer.\n\nBeattie distingue claramente entre responsabilidad sana y culpa excesiva cuando habla de las deudas financieras: \"Comencé concienzudamente a hacer los pagos que podía... Los acreedores querían más, por supuesto, pero eso no era posible.\" Ella hizo su parte real y posible, sin permitir que la culpa la empujara a prometer o exigirse más de lo que genuinamente podía dar.",
"historia": "Beth, después de descubrir que había sido víctima de abuso sexual por parte de su padre, tuvo que navegar cuidadosamente entre la responsabilidad real que tenía en sus patrones de relación adulta, y la culpa excesiva que hubiera significado culparse por el abuso mismo, que no era su responsabilidad en absoluto.\n\n\"Hice las paces con Peter. Hice las paces con mi familia. Hice las paces conmigo misma\", dijo Beth. Es notable que ella distinguiera claramente sus reparaciones necesarias (sus propios patrones de negación, de involucrarse repetidamente con adictos sexuales) del daño que había recibido, del cual no tenía culpa alguna.\n\nBeattie remarca este equilibrio: el Noveno Paso no nos pide revivir indefinidamente la culpa por todo lo que salió mal en nuestra vida —solo por lo que genuinamente nos corresponde reparar. \"Sin culpar al adicto, pudo hablar de su parte en el proceso\", describe sobre Beth. Esa capacidad de hablar de \"su parte\" —ni más, ni menos— es exactamente lo opuesto a la culpa excesiva.",

"aspecto": "Hacer las paces — el propósito real de la reparación",
"ensenanza": "\"De eso se trata este Paso: hacer las paces con nosotros mismos y con otros\", escribe Beattie. \"Ese es el propósito de las reparaciones.\" Después de ver esta semana la dificultad para pedir directamente, la comunicación indirecta, la evitación del conflicto necesario, y la culpa excesiva, llegamos al propósito unificador de todas ellas: la paz.\n\nCada una de estas cuatro características nos aleja de la paz de maneras distintas. No pedir directamente deja necesidades sin satisfacer y resentimientos sin resolver. Comunicar indirectamente confunde y lastima sin dar claridad. Evitar el conflicto pospone la resolución real indefinidamente. Y la culpa excesiva mantiene el daño del pasado activo mucho después de que pudo haberse resuelto.\n\nEl Noveno Paso es, en el fondo, un Paso de valentía práctica: decir la verdad directamente, aunque duela; enfrentar el conflicto necesario, aunque asuste; hacer la reparación posible, y luego soltar el resto. Beattie lo describe con una frase que resume toda la semana: \"Uno de los sentimientos más embriagantes que he descubierto en la recuperación es el que viene de ser honesta con las personas, sin importar cuánto miedo tengo.\"",

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const SEMANAS = JSON.parse(document.getElementById("app-data").textContent);
const TOTAL = 72;
const COOKIE = "guia_biblica_v3";

function getCookie() {
  try {
    const m = document.cookie.split("; ").find(r => r.startsWith(COOKIE + "="));
    return m ? JSON.parse(decodeURIComponent(m.split("=")[1])) : {};
  } catch { return {}; }
}
function saveCookie(data) {
  const exp = new Date(); exp.setFullYear(exp.getFullYear() + 2);
  document.cookie = `${COOKIE}=${encodeURIComponent(JSON.stringify(data))}; expires=${exp.toUTCString()}; path=/`;
}

// ─── PLACEHOLDER DAY ─────────────────────────────────────────────────────────

// ─── EXPORT HELPERS ─────────────────────────────────────────────────────────
async function exportDayAsImage(sem, d, dayIndex) {
  const node = document.getElementById(`infographic-${sem.numero}-${dayIndex}`);
  if (!node || !window.html2canvas) return;
  node.style.display = "block";
  try {
    const canvas = await window.html2canvas(node, { scale: 2, backgroundColor: "#0f1117", useCORS: true });
    const link = document.createElement("a");
    link.download = `Paso${sem.numero}_${d.dia}_${d.aspecto.replace(/[^a-zA-Z0-9]+/g,"_").slice(0,40)}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } catch(e) { console.error("Export failed", e); }
  node.style.display = "none";
}

function exportDayAsPDF(sem, d, dayIndex) {
  const printNode = document.getElementById(`printarea-${sem.numero}-${dayIndex}`);
  if (!printNode) return;
  const existing = document.getElementById("print-area");
  if (existing) existing.remove();
  const clone = printNode.cloneNode(true);
  clone.id = "print-area";
  clone.style.display = "block";
  document.body.appendChild(clone);
  setTimeout(() => { window.print(); clone.remove(); }, 100);
}

            <div style={{fontFamily:"'Lato',sans-serif",fontSize:9,color:"#888",fontWeight:700,letterSpacing:2,marginBottom:12}}>✦ PREGUNTAS DE REFLEXIÓN</div>
            {d.preguntas.map((q,qi)=>(
              <div key={qi} style={{borderLeft:`2px solid ${sem.color}50`,paddingLeft:12,marginBottom:qi<2?12:0}}>
                <div style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:sem.color,fontWeight:700,marginBottom:4}}>{qi+1}.</div>
                <div style={{fontFamily:"'Lato',sans-serif",fontSize:13,color:"#b0a898",lineHeight:1.8}}>{q}</div>
              </div>
            ))}
          </div>

          {/* Práctica */}
          <div style={{background:`${sem.color}0c`,border:`1px solid ${sem.color}30`,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <div style={{fontFamily:"'Lato',sans-serif",fontSize:9,color:sem.color,fontWeight:700,letterSpacing:2,marginBottom:6}}>✎ PRÁCTICA CONCRETA</div>
            <div style={{fontFamily:"'Lato',sans-serif",fontSize:13,color:"#c0b080",lineHeight:1.8}}>{d.practica}</div>
          </div>

          <button className="action-btn" onClick={()=>toggle(sem.numero,i)}
            style={{width:"100%",padding:"11px",borderRadius:8,border:`1px solid ${isDone?sem.color:"#2a2d3a"}`,background:isDone?`${sem.color}22`:"transparent",color:isDone?sem.color:"#777",fontFamily:"'Lato',sans-serif",fontSize:12,fontWeight:700,letterSpacing:1}}>
            {isDone?"✓  COMPLETADO — clic para desmarcar":"MARCAR COMO COMPLETADO"}
          </button>
        </div>
      )}
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [semanaIdx, setSemanaIdx] = useState(0);
  const [done, setDone] = useState({});
  const [expanded, setExpanded] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  useEffect(()=>{setDone(getCookie());},[]);

  const toggle = useCallback((s,d)=>{
    const k=`${s}-${d}`;
    setDone(prev=>{
      const next={...prev};
      next[k]?delete next[k]:(next[k]=1);
      saveCookie(next);
      return next;
    });
  },[]);

  const totalDone = Object.keys(done).length;
  const pct = Math.round((totalDone/TOTAL)*100);
  const sem = SEMANAS[semanaIdx];
  const semDone = sem.dias.filter((_,i)=>done[`${sem.numero}-${i}`]).length;
  const reset = ()=>{ if(confirm("¿Reiniciar todo el progreso?")){setDone({});saveCookie({});} };

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",background:"#0f1117"}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#1a1d26,#12151e)",borderBottom:"1px solid #1e2130",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
          <button className="menu-toggle" onClick={()=>setSidebarOpen(true)}
            style={{background:"transparent",border:"1px solid #2a2d3a",borderRadius:6,width:34,height:34,alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,flexDirection:"column",gap:3}}>
            <span style={{display:"block",width:14,height:1.5,background:"#888",borderRadius:1}}/>
            <span style={{display:"block",width:14,height:1.5,background:"#888",borderRadius:1}}/>
            <span style={{display:"block",width:14,height:1.5,background:"#888",borderRadius:1}}/>
          </button>
          <span style={{color:"#c49a00",fontSize:20}}>✦</span>
          <div style={{minWidth:0}}>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:700,color:"#e8e0d0"}}>Guía Bíblica</div>
            <div style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:"#555",letterSpacing:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>12 PASOS · LIBERTAD DE LA CODEPENDENCIA</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{textAlign:"right"}}>
            <div className="progress-label" style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:"#555",marginBottom:4}}>PROGRESO TOTAL</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div className="progress-bar-header" style={{width:90,height:5,background:"#1e2130",borderRadius:3,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#c49a00,#e8c547)",borderRadius:3,transition:"width 0.4s"}}/>
              </div>
              <span style={{fontFamily:"'Lato',sans-serif",fontSize:13,color:"#c49a00",fontWeight:700}}>{pct}%</span>
            </div>
          </div>
          <button onClick={reset} style={{background:"transparent",border:"1px solid #2a2d3a",borderRadius:6,padding:"4px 10px",color:"#555",cursor:"pointer",fontSize:11,fontFamily:"'Lato',sans-serif"}}>↺</button>
        </div>
      </div>

      <div className="layout" style={{display:"flex",flex:1}}>

        {/* BACKDROP (mobile) */}
        <div className={`sidebar-backdrop ${sidebarOpen?"open":""}`} onClick={()=>setSidebarOpen(false)}></div>

        {/* SIDEBAR */}
        <div className={`sidebar ${sidebarOpen?"open":""}`} style={{width:250,background:"#0d1018",borderRight:"1px solid #1e2130",overflowY:"auto",flexShrink:0,maxHeight:"calc(100vh - 57px)",position:"sticky",top:57}}>
          <div style={{padding:"14px 12px 6px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontFamily:"'Lato',sans-serif",fontSize:9,color:"#444",letterSpacing:2}}>SEMANAS</div>
            <button onClick={()=>setSidebarOpen(false)} className="menu-toggle"
              style={{background:"transparent",border:"none",color:"#555",cursor:"pointer",fontSize:16,alignItems:"center",justifyContent:"center",width:24,height:24}}>✕</button>
          </div>
          {SEMANAS.map((s,i)=>{
            const c=s.dias.filter((_,j)=>done[`${s.numero}-${j}`]).length;
            const p=Math.round((c/6)*100);
            const active=semanaIdx===i;
            return (
              <button key={i} className="week-btn" onClick={()=>{setSemanaIdx(i);setExpanded(null);setSidebarOpen(false);}}
                style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",background:active?`${s.color}1a`:"transparent",borderLeft:active?`3px solid ${s.color}`:"3px solid transparent"}}>
                <div style={{width:30,height:30,borderRadius:"50%",background:active?s.color:"#1a1d26",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,fontFamily:"'Lato',sans-serif",color:active?"#fff":"#555",flexShrink:0}}>
                  {s.numero}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:3}}>
                    <div style={{fontFamily:"'Lato',sans-serif",fontSize:12,fontWeight:700,color:active?"#e8e0d0":"#777",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.titulo}</div>
                    {!s.completo&&<span style={{fontSize:9,color:"#444",flexShrink:0}}>✎</span>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{flex:1,height:3,background:"#1a1d26",borderRadius:2,overflow:"hidden"}}>
                      <div style={{width:`${p}%`,height:"100%",background:s.color,transition:"width 0.3s"}}/>
                    </div>
                    <span style={{fontSize:10,color:p===100?"#c49a00":"#444",fontFamily:"'Lato',sans-serif"}}>{c}/6</span>
                  </div>
                </div>
                {p===100&&<span style={{color:"#c49a00",fontSize:13}}>✓</span>}
              </button>
            );
          })}
          <div style={{padding:"10px 14px",borderTop:"1px solid #1a1d26",marginTop:4}}>
            <div style={{fontFamily:"'Lato',sans-serif",fontSize:9,color:"#444",marginBottom:4}}>✎ = contenido próximamente</div>
            <div style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:"#444",marginBottom:4}}>{totalDone}/{TOTAL} días completados</div>
            <div style={{width:"100%",height:5,background:"#1a1d26",borderRadius:3,overflow:"hidden"}}>
              <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#c49a00,#e8c547)",transition:"width 0.4s"}}/>
            </div>
          </div>
        </div>

        {/* MAIN */}
        <div className="main-content" style={{flex:1,overflowY:"auto",padding:"28px 28px 60px",maxHeight:"calc(100vh - 57px)"}}>

          {/* Mobile week switcher pill */}
          <button className="week-pill-mobile" onClick={()=>setSidebarOpen(true)}
            style={{width:"100%",alignItems:"center",justifyContent:"space-between",gap:10,padding:"10px 14px",marginBottom:18,borderRadius:10,border:`1px solid ${sem.color}40`,background:`${sem.color}14`,cursor:"pointer",textAlign:"left"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:sem.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,fontFamily:"'Lato',sans-serif",color:"#fff",flexShrink:0}}>{sem.numero}</div>
              <div style={{minWidth:0}}>
                <div style={{fontFamily:"'Lato',sans-serif",fontSize:9,color:sem.color,letterSpacing:2,fontWeight:700}}>{sem.paso.toUpperCase()}</div>
                <div style={{fontFamily:"'Lato',sans-serif",fontSize:13,fontWeight:700,color:"#e8e0d0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{sem.titulo}</div>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
              <span style={{fontFamily:"'Lato',sans-serif",fontSize:11,color:"#888"}}>Ver semanas</span>
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="#888" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          </button>

          {/* Week header */}
          <div style={{marginBottom:28}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
              <div style={{width:44,height:44,borderRadius:"50%",background:sem.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,fontWeight:700,fontFamily:"'Lato',sans-serif",color:"#fff",flexShrink:0}}>{sem.numero}</div>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
                  <div style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:sem.color,letterSpacing:2,fontWeight:700}}>{sem.paso.toUpperCase()}</div>
                  {!sem.completo&&<span style={{fontFamily:"'Lato',sans-serif",fontSize:9,color:"#555",background:"#1a1d26",border:"1px solid #2a2d3a",borderRadius:4,padding:"1px 6px",letterSpacing:1}}>PRÓXIMAMENTE</span>}
                </div>
                <h1 className="week-title" style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,color:"#e8e0d0",lineHeight:1.2}}>{sem.titulo}</h1>
              </div>
            </div>
            <p style={{fontFamily:"'Lato',sans-serif",fontSize:13,color:"#777",lineHeight:1.7,fontStyle:"italic",maxWidth:600,marginBottom:8}}>{sem.descripcion}</p>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:16}}>
              <span style={{color:sem.color,fontSize:11}}>✦</span>
              <span style={{fontFamily:"'Lato',sans-serif",fontSize:12,color:"#888"}}>Tema central: <span style={{color:"#b8a87a"}}>{sem.tema}</span></span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {sem.dias.map((_,i)=>(
                <div key={i} style={{flex:1,height:4,borderRadius:2,background:done[`${sem.numero}-${i}`]?sem.color:"#1e2130",transition:"background 0.3s"}}/>
              ))}
              <span style={{fontFamily:"'Lato',sans-serif",fontSize:11,color:semDone===6?"#c49a00":"#555",whiteSpace:"nowrap",marginLeft:4}}>
                {semDone===6?"✓ Completa":`${semDone}/6`}
              </span>
            </div>
          </div>

          {/* Day cards */}
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {sem.dias.map((d,i)=>
              sem.completo
                ?<FullDay key={i} d={d} i={i} sem={sem} done={done} toggle={toggle} expanded={expanded} setExpanded={setExpanded}/>
                :<PlaceholderDay key={i} d={d} i={i} sem={sem} done={done} toggle={toggle} expanded={expanded} setExpanded={setExpanded}/>
            )}
          </div>

          {/* Tarea semanal */}
          {sem.completo&&sem.tarea&&(
            <div style={{marginTop:28,background:"#0d1018",border:`1px solid ${sem.color}30`,borderRadius:12,padding:"20px 22px"}}>
              <div style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:sem.color,fontWeight:700,letterSpacing:2,marginBottom:14}}>✦ TAREA DE LA SEMANA</div>
              <div style={{fontFamily:"'Lato',sans-serif",fontSize:11,color:"#555",marginBottom:12,lineHeight:1.6}}>Preguntas de Melody Beattie para reflexionar en tu diario o con alguien de confianza:</div>
              {sem.tarea.map((t,ti)=>(
                <div key={ti} style={{display:"flex",gap:12,marginBottom:10}}>
                  <div style={{width:22,height:22,borderRadius:"50%",background:`${sem.color}20`,border:`1px solid ${sem.color}50`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Lato',sans-serif",fontSize:10,fontWeight:700,color:sem.color,flexShrink:0}}>{ti+1}</div>
                  <div style={{fontFamily:"'Lato',sans-serif",fontSize:13,color:"#a0988a",lineHeight:1.75}}>{t}</div>
                </div>
              ))}
              {sem.tareaVerse&&(
                <div style={{marginTop:16,borderTop:`1px solid ${sem.color}20`,paddingTop:14}}>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:14,color:"#c8b060",lineHeight:1.7,fontStyle:"italic"}}>{sem.tareaVerse.texto}</div>
                  <div style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:sem.color,marginTop:4,letterSpacing:1}}>{sem.tareaVerse.ref.toUpperCase()}</div>
                </div>
              )}
            </div>
          )}

          {/* Navigation */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:36,paddingTop:20,borderTop:"1px solid #1a1d26"}}>
            <button className="nav-btn" disabled={semanaIdx===0} onClick={()=>{setSemanaIdx(semanaIdx-1);setExpanded(null);}}
              style={{padding:"9px 18px",borderRadius:8,border:"1px solid #1e2130",background:"transparent",color:semanaIdx===0?"#2a2d3a":"#666",fontFamily:"'Lato',sans-serif",fontSize:12,cursor:semanaIdx===0?"default":"pointer"}}>
              ← Semana anterior
            </button>
            <span style={{fontFamily:"'Lato',sans-serif",fontSize:11,color:"#444"}}>{semanaIdx+1} / 12</span>
            <button className="nav-btn" disabled={semanaIdx===11} onClick={()=>{setSemanaIdx(semanaIdx+1);setExpanded(null);}}
              style={{padding:"9px 18px",borderRadius:8,border:`1px solid ${semanaIdx===11?"#1e2130":SEMANAS[semanaIdx+1]?.color+"50"}`,background:"transparent",color:semanaIdx===11?"#2a2d3a":"#666",fontFamily:"'Lato',sans-serif",fontSize:12,cursor:semanaIdx===11?"default":"pointer"}}>
              Siguiente semana →
            </button>
          </div>

          {pct===100&&(
            <div style={{marginTop:28,background:"linear-gradient(135deg,#1a1400,#160c00)",border:"1px solid #c49a0030",borderRadius:12,padding:"22px 24px",textAlign:"center"}}>
              <div style={{fontSize:28,marginBottom:10}}>✦</div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:19,color:"#c49a00",marginBottom:8}}>Has completado las 12 semanas</div>
              <div style={{fontFamily:"'Lato',sans-serif",fontSize:13,color:"#777",lineHeight:1.7,fontStyle:"italic"}}>"El que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo."</div>
              <div style={{fontFamily:"'Lato',sans-serif",fontSize:10,color:"#c49a00",marginTop:6,letterSpacing:2}}>FILIPENSES 1:6</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
